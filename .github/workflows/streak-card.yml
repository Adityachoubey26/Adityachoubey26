name: Streak Card

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Generate streak card
        env:
          GH_USERNAME: Adityachoubey26
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python .github/scripts/generate_streak_card.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add streak-card.svg
          git diff --staged --quiet || git commit -m "Update streak card"
          git push
